<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coastal Weather Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            ocean: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 14px -2px rgba(12, 74, 110, 0.05);
    }
    .glass-card-hover {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .glass-card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -4px rgba(14, 165, 233, 0.14);
    }
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .skeleton {
      animation: pulse-subtle 1.8s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 via-sky-50/30 to-cyan-50/40 text-slate-800 min-h-screen xl:h-screen flex flex-col justify-center font-sans p-2 sm:p-3 xl:p-2.5 overflow-x-hidden">

  <!-- 5-Column Weather Cards Grid (Ultra Compact Layout) -->
  <main class="w-full max-w-[1580px] mx-auto xl:h-[96vh] flex flex-col justify-center">
    <div id="weather-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-2.5 h-full items-stretch">
      <!-- Injected via JavaScript -->
    </div>
  </main>

  <!-- 24-Hour Detailed Breakdown Modal -->
  <div id="hourly-modal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-3">
    <div class="bg-white rounded-2xl max-w-xl w-full shadow-2xl border border-slate-100 p-4 max-h-[88vh] flex flex-col transform transition-all scale-95 opacity-0 duration-150" id="modal-box">
      <div class="flex items-center justify-between pb-2.5 border-b border-slate-100">
        <div>
          <h2 id="modal-city-name" class="text-base font-bold font-display text-slate-900 leading-tight">City Details</h2>
          <p id="modal-city-subtitle" class="text-[11px] text-slate-500">24-hour hour-by-hour forecast</p>
        </div>
        <button onclick="closeHourlyModal()" class="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <div class="py-2.5 overflow-y-auto space-y-1.5 flex-grow pr-1" id="hourly-list-container">
        <!-- Injected via JS -->
      </div>

      <div class="pt-2 border-t border-slate-100 flex justify-between items-center text-[11px] text-slate-500">
        <span id="modal-tz-note">Times shown in local location timezone</span>
        <button onclick="closeHourlyModal()" class="px-3 py-1.5 bg-slate-900 text-white rounded-lg text-[11px] font-semibold hover:bg-slate-800 transition">Close</button>
      </div>
    </div>
  </div>

  <!-- Script Logic -->
  <script>
    const LOCATIONS = [
      {
        id: 'jupiter',
        name: 'Jupiter',
        lat: 26.9342,
        lon: -80.0942,
        timezone: 'America/New_York'
      },
      {
        id: 'beach-haven',
        name: 'Beach Haven',
        lat: 39.2415,
        lon: -74.2412,
        timezone: 'America/New_York'
      },
      {
        id: 'medford-lakes',
        name: 'Medford Lakes',
        lat: 39.8665,
        lon: -74.8213,
        timezone: 'America/New_York'
      },
      {
        id: 'carlsbad',
        name: 'Carlsbad',
        lat: 33.1581,
        lon: -117.3506,
        timezone: 'America/Los_Angeles'
      },
      {
        id: 'wrightsville-beach',
        name: 'Wrightsville Beach',
        lat: 34.2096,
        lon: -77.7964,
        timezone: 'America/New_York'
      }
    ];

    let currentUnit = 'fahrenheit';
    let weatherStore = {};

    function decodeWmo(code) {
      const map = {
        0: { label: 'Clear', icon: 'sun', color: 'text-amber-500' },
        1: { label: 'Mainly Clear', icon: 'sun-medium', color: 'text-amber-400' },
        2: { label: 'Partly Cloudy', icon: 'cloud-sun', color: 'text-sky-500' },
        3: { label: 'Overcast', icon: 'cloud', color: 'text-slate-500' },
        45: { label: 'Fog', icon: 'cloud-fog', color: 'text-slate-400' },
        48: { label: 'Freezing Fog', icon: 'cloud-fog', color: 'text-slate-400' },
        51: { label: 'Light Drizzle', icon: 'cloud-drizzle', color: 'text-blue-400' },
        53: { label: 'Drizzle', icon: 'cloud-drizzle', color: 'text-blue-500' },
        55: { label: 'Heavy Drizzle', icon: 'cloud-rain', color: 'text-blue-600' },
        61: { label: 'Light Rain', icon: 'cloud-rain', color: 'text-blue-500' },
        63: { label: 'Rain', icon: 'cloud-rain', color: 'text-blue-600' },
        65: { label: 'Heavy Rain', icon: 'cloud-lightning', color: 'text-indigo-600' },
        71: { label: 'Light Snow', icon: 'snowflake', color: 'text-sky-300' },
        73: { label: 'Snow', icon: 'snowflake', color: 'text-sky-400' },
        75: { label: 'Heavy Snow', icon: 'snowflake', color: 'text-sky-500' },
        80: { label: 'Showers', icon: 'cloud-sun-rain', color: 'text-blue-500' },
        81: { label: 'Showers', icon: 'cloud-rain', color: 'text-blue-600' },
        82: { label: 'Heavy Showers', icon: 'cloud-lightning', color: 'text-indigo-700' },
        95: { label: 'Thunderstorm', icon: 'zap', color: 'text-amber-500' },
        96: { label: 'Thunderstorm Hail', icon: 'zap', color: 'text-rose-500' },
        99: { label: 'Severe Storm', icon: 'zap', color: 'text-rose-600' },
      };
      return map[code] || { label: 'Partly Cloudy', icon: 'cloud-sun', color: 'text-sky-500' };
    }

    function degToCompass(deg) {
      const val = Math.floor((deg / 22.5) + 0.5);
      const arr = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];
      return arr[(val % 16)];
    }

    function getLocalTimeString(timezone) {
      try {
        return new Intl.DateTimeFormat([], {
          timeZone: timezone,
          hour: 'numeric',
          minute: '2-digit'
        }).format(new Date());
      } catch (e) {
        return '';
      }
    }

    function buildApiUrl(loc) {
      return `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,precipitation_probability_max,wind_speed_10m_max&timezone=${encodeURIComponent(loc.timezone)}&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&forecast_days=7`;
    }

    function generateFallback(loc) {
      const baseTemp = loc.name === 'Jupiter' ? 84 : loc.name === 'Carlsbad' ? 70 : loc.name === 'Wrightsville Beach' ? 75 : loc.name === 'Medford Lakes' ? 65 : 63;
      const days = ['Today', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
      
      return {
        current: {
          temperature_2m: baseTemp,
          apparent_temperature: baseTemp + 1,
          relative_humidity_2m: 65,
          weather_code: 1,
          wind_speed_10m: 10,
          wind_direction_10m: 120,
          precipitation: 0
        },
        daily: {
          time: days.map((_, i) => new Date(Date.now() + i * 86400000).toISOString().split('T')[0]),
          weather_code: [1, 0, 2, 61, 1, 0, 2],
          temperature_2m_max: days.map((_, i) => baseTemp + 3 + (i % 3)),
          temperature_2m_min: days.map((_, i) => baseTemp - 6 + (i % 2)),
          uv_index_max: [6, 7, 6, 3, 7, 7, 6],
          precipitation_probability_max: [10, 5, 20, 60, 10, 0, 15],
          wind_speed_10m_max: days.map(() => 12)
        },
        hourly: {
          time: Array.from({length: 24}, (_, i) => new Date(Date.now() + i * 3600000).toISOString()),
          temperature_2m: Array.from({length: 24}, (_, i) => Math.round(baseTemp + Math.sin(i / 3) * 4)),
          weather_code: Array.from({length: 24}, () => 1),
          precipitation_probability: Array.from({length: 24}, () => 10),
          wind_speed_10m: Array.from({length: 24}, () => 10),
          relative_humidity_2m: Array.from({length: 24}, () => 65)
        }
      };
    }

    function renderSkeletons() {
      const container = document.getElementById('weather-cards-container');
      container.innerHTML = LOCATIONS.map(() => `
        <div class="glass-card rounded-2xl p-3 border border-white/60 flex flex-col justify-between skeleton h-full min-h-[380px]">
          <div class="h-4 w-28 bg-slate-200 rounded"></div>
          <div class="h-16 bg-slate-100 rounded-xl my-2"></div>
          <div class="h-14 bg-slate-100 rounded-xl my-2"></div>
          <div class="h-32 bg-slate-100 rounded-xl flex-grow"></div>
          <div class="h-6 bg-slate-200 rounded-lg mt-2"></div>
        </div>
      `).join('');
    }

    async function fetchAllWeather() {
      if (Object.keys(weatherStore).length === 0) {
        renderSkeletons();
      }

      const promises = LOCATIONS.map(async (loc) => {
        try {
          const res = await fetch(buildApiUrl(loc));
          if (!res.ok) throw new Error('API fetch error');
          const data = await res.json();
          weatherStore[loc.id] = data;
        } catch (err) {
          console.warn(`Fallback triggered for ${loc.name}`, err);
          weatherStore[loc.id] = generateFallback(loc);
        }
      });

      await Promise.all(promises);
      renderWeatherGrid();
    }

    function renderWeatherGrid() {
      const container = document.getElementById('weather-cards-container');

      container.innerHTML = LOCATIONS.map((loc) => {
        const data = weatherStore[loc.id];
        if (!data) return '';

        const current = data.current;
        const daily = data.daily;
        const condition = decodeWmo(current.weather_code);
        const localTime = getLocalTimeString(loc.timezone);

        const windDir = degToCompass(current.wind_direction_10m);
        const currentTemp = Math.round(current.temperature_2m);
        const feelsLike = Math.round(current.apparent_temperature);
        const todayHigh = Math.round(daily.temperature_2m_max[0]);
        const todayLow = Math.round(daily.temperature_2m_min[0]);
        const todayUv = Math.round(daily.uv_index_max[0] || 0);
        const todayPrecip = Math.round(daily.precipitation_probability_max[0] ?? 0);
        const currentHumidity = Math.round(current.relative_humidity_2m);
        const currentWind = Math.round(current.wind_speed_10m);

        let forecastDaysHtml = '';
        const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        
        for (let i = 0; i < 7; i++) {
          const dateObj = new Date(daily.time[i] + 'T00:00:00');
          const isToday = i === 0;
          const dayName = isToday ? 'Today' : dayNames[dateObj.getDay()];
          const dayCondition = decodeWmo(daily.weather_code[i]);
          const hi = Math.round(daily.temperature_2m_max[i]);
          const lo = Math.round(daily.temperature_2m_min[i]);
          const rainProb = Math.round(daily.precipitation_probability_max[i] ?? 0);

          forecastDaysHtml += `
            <div class="flex items-center justify-between text-[11px] xl:text-[10.5px] 2xl:text-[11.5px] py-[3px] px-1.5 rounded-lg transition hover:bg-white/80 ${isToday ? 'bg-sky-50/80 font-semibold text-ocean-900' : 'text-slate-600'}">
              <span class="w-10 ${isToday ? 'text-ocean-700 font-bold' : ''}">${dayName}</span>
              <div class="flex items-center gap-1 w-12 justify-center">
                <i data-lucide="${dayCondition.icon}" class="w-3.5 h-3.5 ${dayCondition.color} flex-shrink-0"></i>
                ${rainProb > 25 ? `<span class="text-[9.5px] text-blue-500 font-medium">${rainProb}%</span>` : ''}
              </div>
              <div class="flex items-center gap-1.5 text-right font-mono text-[11px]">
                <span class="text-slate-800 font-bold">${hi}°</span>
                <span class="text-slate-400 text-[10px]">${lo}°</span>
              </div>
            </div>
          `;
        }

        return `
          <div class="glass-card glass-card-hover rounded-2xl p-2.5 2xl:p-3 border border-white/80 flex flex-col justify-between relative overflow-hidden h-full group">
            
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-sky-400 via-ocean-500 to-cyan-400"></div>

            <!-- Header: Location Name & Time (No state label, strict single line) -->
            <div class="flex items-center justify-between gap-1 mb-1.5 pb-1 border-b border-slate-100/70">
              <h2 class="text-[13.5px] sm:text-[14px] 2xl:text-[15px] font-bold font-display text-slate-900 whitespace-nowrap overflow-hidden text-ellipsis leading-none" title="${loc.name}">
                ${loc.name}
              </h2>
              <span class="text-[10px] font-mono text-slate-400 font-medium bg-slate-100/80 px-1.5 py-0.5 rounded leading-none flex-shrink-0">
                ${localTime}
              </span>
            </div>

            <!-- Compact Current Weather Hero (Side-by-side icon & large temp, minimal vertical space) -->
            <div class="flex items-center justify-between px-2 py-1.5 bg-gradient-to-r from-sky-50/70 to-blue-50/40 rounded-xl border border-sky-100/50 mb-1.5">
              <div class="flex items-center gap-2">
                <div class="p-1.5 rounded-xl bg-white shadow-xs flex-shrink-0">
                  <i data-lucide="${condition.icon}" class="w-6 h-6 2xl:w-7 2xl:h-7 ${condition.color}"></i>
                </div>
                <div class="leading-none">
                  <div class="text-2xl 2xl:text-3xl font-display font-extrabold text-slate-900 tracking-tight leading-none">${currentTemp}°</div>
                  <div class="text-[10px] 2xl:text-[11px] font-semibold text-slate-600 truncate max-w-[85px] mt-0.5">${condition.label}</div>
                </div>
              </div>
              <div class="text-right text-[10px] 2xl:text-[11px] text-slate-500 font-mono leading-tight">
                <div><span class="text-slate-400">H:</span> <span class="font-bold text-slate-800">${todayHigh}°</span></div>
                <div><span class="text-slate-400">L:</span> <span class="font-bold text-slate-600">${todayLow}°</span></div>
                <div class="text-[9.5px] text-slate-400 mt-0.5">${feelsLike}° feel</div>
              </div>
            </div>

            <!-- Ultra-compact 2x2 Secondary Metrics -->
            <div class="grid grid-cols-2 gap-1 mb-1.5 text-[10.5px]">
              <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-50/80 border border-slate-100/80">
                <i data-lucide="wind" class="w-3 h-3 text-sky-500 flex-shrink-0"></i>
                <div class="truncate leading-none">
                  <span class="text-slate-400 text-[9px] block">Wind</span>
                  <span class="font-bold text-slate-800 text-[10.5px]">${currentWind} mph ${windDir}</span>
                </div>
              </div>

              <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-50/80 border border-slate-100/80">
                <i data-lucide="droplets" class="w-3 h-3 text-blue-500 flex-shrink-0"></i>
                <div class="truncate leading-none">
                  <span class="text-slate-400 text-[9px] block">Humidity</span>
                  <span class="font-bold text-slate-800 text-[10.5px]">${currentHumidity}%</span>
                </div>
              </div>

              <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-slate-50/80 border border-slate-100/80">
                <i data-lucide="sun" class="w-3 h-3 text-amber-500 flex-shrink-0"></i>
                <div class="truncate leading-none">
                  <span class="text-slate-400 text-[9px] block">UV Index</span>
                  <span class="font-bold text-slate-800 text-[10.5px]">${todayUv}</span>
                </div>
              </div>

              <div class="flex items-center gap-1.5 px-2 py-1 rounded-lg bg-blue-50/60 border border-blue-100/70">
                <i data-lucide="cloud-rain" class="w-3 h-3 text-blue-500 flex-shrink-0"></i>
                <div class="truncate leading-none">
                  <span class="text-blue-500 text-[9px] block">Precip</span>
                  <span class="font-bold text-blue-900 text-[10.5px]">${todayPrecip}%</span>
                </div>
              </div>
            </div>

            <!-- 7-Day Slim Strip -->
            <div class="flex-grow flex flex-col justify-between py-1 border-t border-slate-100/80">
              <div class="text-[9px] uppercase font-bold tracking-wider text-slate-400 mb-0.5 px-1">7-Day Outlook</div>
              <div class="space-y-[1px]">
                ${forecastDaysHtml}
              </div>
            </div>

            <!-- Slim 24-Hour Button -->
            <div class="pt-1.5 border-t border-slate-100/80 mt-1">
              <button onclick="openHourlyModal('${loc.id}')" class="w-full py-1.5 px-2 rounded-lg bg-white hover:bg-ocean-50 border border-slate-200/80 text-ocean-700 font-semibold text-[11px] flex items-center justify-center gap-1.5 transition active:scale-98 shadow-xs">
                <i data-lucide="clock" class="w-3 h-3"></i>
                <span>24-Hour Timeline</span>
              </button>
            </div>

          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function openHourlyModal(locationId) {
      const loc = LOCATIONS.find(l => l.id === locationId);
      const data = weatherStore[locationId];
      if (!loc || !data || !data.hourly) return;

      document.getElementById('modal-city-name').textContent = loc.name;
      document.getElementById('modal-city-subtitle').textContent = `24-Hour Timeline (${loc.timezone})`;

      const listContainer = document.getElementById('hourly-list-container');

      const hoursHtml = data.hourly.time.slice(0, 24).map((timeStr, idx) => {
        const timeObj = new Date(timeStr);
        const hourFormatted = timeObj.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        const code = data.hourly.weather_code[idx];
        const cond = decodeWmo(code);
        const temp = Math.round(data.hourly.temperature_2m[idx]);
        const precip = Math.round(data.hourly.precipitation_probability ? data.hourly.precipitation_probability[idx] : 0);
        const wind = Math.round(data.hourly.wind_speed_10m[idx]);

        return `
          <div class="flex items-center justify-between p-2 rounded-xl bg-slate-50 hover:bg-sky-50/60 transition border border-slate-100 text-[11.5px]">
            <div class="w-16 font-semibold text-slate-700">${hourFormatted}</div>
            <div class="flex items-center gap-1.5 w-28">
              <i data-lucide="${cond.icon}" class="w-3.5 h-3.5 ${cond.color}"></i>
              <span class="truncate text-slate-600">${cond.label}</span>
            </div>
            <div class="flex items-center gap-1 w-14 text-blue-600 font-medium">
              <i data-lucide="cloud-rain" class="w-3 h-3"></i> ${precip}%
            </div>
            <div class="flex items-center gap-1 w-20 text-slate-500 font-medium">
              <i data-lucide="wind" class="w-3 h-3 text-sky-500"></i> ${wind} mph
            </div>
            <div class="font-bold font-mono text-slate-800 text-xs">
              ${temp}°
            </div>
          </div>
        `;
      }).join('');

      listContainer.innerHTML = hoursHtml;

      const modal = document.getElementById('hourly-modal');
      const box = document.getElementById('modal-box');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => {
        box.classList.remove('scale-95', 'opacity-0');
        box.classList.add('scale-100', 'opacity-100');
      }, 10);

      lucide.createIcons();
    }

    function closeHourlyModal() {
      const modal = document.getElementById('hourly-modal');
      const box = document.getElementById('modal-box');
      box.classList.remove('scale-100', 'opacity-100');
      box.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }, 150);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeHourlyModal();
      }
    });

    document.getElementById('hourly-modal').addEventListener('click', (e) => {
      if (e.target.id === 'hourly-modal') closeHourlyModal();
    });

    setInterval(() => {
      fetchAllWeather();
    }, 10 * 60 * 1000);

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      fetchAllWeather();
    });
  </script>
</body>
</html>
