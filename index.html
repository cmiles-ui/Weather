<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coastal Weather Dashboard</title>
  
  <!-- Weather Favicon (Sun + Cloud SVG) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='sun' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23f59e0b'/%3E%3Cstop offset='100%25' stop-color='%23d97706'/%3E%3C/linearGradient%3E%3ClinearGradient id='cloud' x1='0%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='100%25' stop-color='%23cbd5e1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='38' cy='26' r='14' fill='url(%23sun)'/%3E%3Cpath d='M19 48h26a11 11 0 0 0 1-21.9A15 15 0 0 0 17.5 32 9.5 9.5 0 0 0 19 48z' fill='url(%23cloud)' stroke='%2394a3b8' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            ocean: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    };
  </script>

  <style>
    body {
      background: radial-gradient(circle at 15% 15%, #e0f2fe 0%, #f8fafc 45%, #f1f5f9 100%);
      min-height: 100vh;
      color: #0f172a;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="p-2 sm:p-3 xl:p-4 selection:bg-sky-200">

  <!-- Main Grid: 5 columns on desktop, 3 on tablet, 1 on mobile -->
  <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-3 max-w-[1920px] mx-auto items-start">
    <!-- Generated dynamically via JavaScript -->
  </div>

  <!-- 24-Hour Timeline Drawer Modal -->
  <div id="hourlyModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity duration-200" onclick="handleBackdropClick(event)">
    <div class="bg-white w-full sm:max-w-2xl sm:rounded-2xl rounded-t-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col max-h-[85vh] animate-in fade-in duration-150">
      
      <!-- Drawer Header -->
      <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <div>
          <h3 id="modalTitle" class="text-base font-bold text-slate-900">24-Hour Forecast</h3>
          <p id="modalSubtitle" class="text-xs text-slate-500 font-medium">Hourly conditions & probability</p>
        </div>
        <button onclick="closeHourlyModal()" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-200/80 transition" aria-label="Close dialog">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Drawer Content -->
      <div id="modalHourlyList" class="p-4 overflow-y-auto custom-scrollbar divide-y divide-slate-100 space-y-1">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <script>
    // Strict Location Ordering: Jupiter first, then Beach Haven, Medford Lakes, Carlsbad, Wrightsville Beach
    const LOCATIONS = [
      {
        id: 'jupiter',
        name: 'Jupiter',
        lat: 26.9342,
        lon: -80.0942,
        timezone: 'America/New_York'
      },
      {
        id: 'beach_haven',
        name: 'Beach Haven',
        lat: 39.2415,
        lon: -74.2429,
        timezone: 'America/New_York'
      },
      {
        id: 'medford_lakes',
        name: 'Medford Lakes',
        lat: 39.8665,
        lon: -74.8213,
        timezone: 'America/New_York'
      },
      {
        id: 'carlsbad',
        name: 'Carlsbad',
        lat: 33.1581,
        lon: -117.3506,
        timezone: 'America/Los_Angeles'
      },
      {
        id: 'wrightsville_beach',
        name: 'Wrightsville Beach',
        lat: 34.2082,
        lon: -77.7964,
        timezone: 'America/New_York'
      }
    ];

    // Global in-memory cache
    const weatherDataStore = {};

    // Decode WMO weather codes into clean labels and Lucide icon keys
    function decodeWmo(code) {
      if (code === 0) return { label: 'Clear', icon: 'sun', color: 'text-amber-500' };
      if (code === 1) return { label: 'Mainly Clear', icon: 'sun-medium', color: 'text-amber-500' };
      if (code === 2) return { label: 'Partly Cloudy', icon: 'cloud-sun', color: 'text-sky-500' };
      if (code === 3) return { label: 'Overcast', icon: 'cloud', color: 'text-slate-500' };
      if (code === 45 || code === 48) return { label: 'Foggy', icon: 'cloud-fog', color: 'text-slate-400' };
      if (code >= 51 && code <= 55) return { label: 'Drizzle', icon: 'cloud-drizzle', color: 'text-blue-400' };
      if (code >= 61 && code <= 65) return { label: 'Rain', icon: 'cloud-rain', color: 'text-blue-500' };
      if (code >= 71 && code <= 77) return { label: 'Snow', icon: 'snowflake', color: 'text-sky-300' };
      if (code >= 80 && code <= 82) return { label: 'Showers', icon: 'cloud-hail', color: 'text-blue-600' };
      if (code >= 95 && code <= 99) return { label: 'Thunderstorm', icon: 'cloud-lightning', color: 'text-purple-600' };
      return { label: 'Fair', icon: 'sun', color: 'text-amber-500' };
    }

    // Convert degrees to compass direction
    function degToCompass(deg) {
      if (deg === null || deg === undefined) return '';
      const val = Math.round((deg / 22.5) + 0.5);
      const arr = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
      return arr[(val % 16)];
    }

    // Format local time for header
    function getLocalTime(timezone) {
      try {
        return new Intl.DateTimeFormat('en-US', {
          timeZone: timezone,
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        }).format(new Date());
      } catch (e) {
        return '';
      }
    }

    // Fetch live data from Open-Meteo with fallback
    async function fetchLocationWeather(loc) {
      const url = 'https://api.open-meteo.com/v1/forecast?' +
        'latitude=' + loc.lat +
        '&longitude=' + loc.lon +
        '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m' +
        '&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max' +
        '&temperature_unit=fahrenheit' +
        '&wind_speed_unit=mph' +
        '&precipitation_unit=inch' +
        '&timezone=' + encodeURIComponent(loc.timezone);

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Network error: ' + res.status);
        const data = await res.json();
        return data;
      } catch (err) {
        console.warn('Weather fetch fallback for ' + loc.name, err);
        return createFallbackData(loc);
      }
    }

    // Realistic fallback data generator in case of network issues
    function createFallbackData(loc) {
      const isWarm = loc.id === 'jupiter';
      const isWest = loc.id === 'carlsbad';
      const baseTemp = isWarm ? 76 : (isWest ? 66 : 56);
      
      const now = new Date();
      const dailyTimes = [];
      const hourlyTimes = [];

      for (let i = 0; i < 7; i++) {
        const d = new Date(now);
        d.setDate(d.getDate() + i);
        dailyTimes.push(d.toISOString().split('T')[0]);
      }

      for (let i = 0; i < 24; i++) {
        const d = new Date(now);
        d.setHours(d.getHours() + i);
        hourlyTimes.push(d.toISOString());
      }

      return {
        current: {
          temperature_2m: baseTemp,
          apparent_temperature: baseTemp + 1,
          relative_humidity_2m: 65,
          weather_code: 1,
          wind_speed_10m: 8,
          wind_direction_10m: 85
        },
        daily: {
          time: dailyTimes,
          weather_code: [1, 2, 0, 1, 61, 2, 0],
          temperature_2m_max: [baseTemp + 6, baseTemp + 7, baseTemp + 5, baseTemp + 8, baseTemp + 4, baseTemp + 6, baseTemp + 7],
          temperature_2m_min: [baseTemp - 8, baseTemp - 7, baseTemp - 6, baseTemp - 9, baseTemp - 5, baseTemp - 7, baseTemp - 8],
          precipitation_probability_max: [0, 10, 5, 0, 45, 15, 0],
          uv_index_max: [6, 7, 6, 7, 4, 6, 7]
        },
        hourly: {
          time: hourlyTimes,
          temperature_2m: Array.from({ length: 24 }, function(_, i) { return baseTemp + Math.sin(i / 3) * 6; }),
          precipitation_probability: Array.from({ length: 24 }, function() { return 5; }),
          weather_code: Array.from({ length: 24 }, function() { return 1; }),
          wind_speed_10m: Array.from({ length: 24 }, function() { return 8; })
        }
      };
    }

    // Render 7-day outlook rows safely
    function buildDailyRows(daily) {
      const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      let html = '';

      for (let i = 0; i < 7; i++) {
        const dateObj = new Date(daily.time[i] + 'T00:00:00');
        const isToday = i === 0;
        const dayLabel = isToday ? 'Today' : dayNames[dateObj.getDay()];
        const condition = decodeWmo(daily.weather_code[i]);
        const hi = Math.round(daily.temperature_2m_max[i]);
        const lo = Math.round(daily.temperature_2m_min[i]);
        const rainProb = Math.round(daily.precipitation_probability_max[i] || 0);

        const activeBg = isToday ? 'bg-sky-50 font-bold text-ocean-950' : 'text-slate-700 font-semibold';
        const dayColor = isToday ? 'text-ocean-700 font-bold' : '';

        const rainBadge = rainProb > 20
          ? '<span class="text-[12px] text-blue-600 font-bold">' + rainProb + '%</span>'
          : '';

        html += '<div class="flex items-center justify-between text-[13px] py-1 px-1.5 rounded-lg transition hover:bg-slate-50 ' + activeBg + '">' +
          '<span class="w-12 ' + dayColor + '">' + dayLabel + '</span>' +
          '<div class="flex items-center gap-1.5 w-14 justify-center">' +
            '<i data-lucide="' + condition.icon + '" class="w-4 h-4 ' + condition.color + ' flex-shrink-0"></i>' +
            rainBadge +
          '</div>' +
          '<div class="flex items-center gap-1.5 text-right font-mono text-[13px]">' +
            '<span class="text-slate-900 font-bold">' + hi + '°</span>' +
            '<span class="text-slate-500 font-medium text-[12px]">' + lo + '°</span>' +
          '</div>' +
        '</div>';
      }

      return html;
    }

    // Render single card
    function buildCardHtml(loc, data) {
      const current = data.current;
      const daily = data.daily;
      const localTime = getLocalTime(loc.timezone);
      const condition = decodeWmo(current.weather_code);

      const curTemp = Math.round(current.temperature_2m);
      const feelsLike = Math.round(current.apparent_temperature);
      const todayHi = Math.round(daily.temperature_2m_max[0]);
      const todayLo = Math.round(daily.temperature_2m_min[0]);
      const curWind = Math.round(current.wind_speed_10m);
      const windDir = degToCompass(current.wind_direction_10m);
      const curHumidity = Math.round(current.relative_humidity_2m);
      const todayUv = Math.round(daily.uv_index_max[0] || 0);
      const todayPrecip = Math.round(daily.precipitation_probability_max[0] || 0);

      const dailyHtml = buildDailyRows(daily);

      return '<div class="bg-white/90 backdrop-blur rounded-2xl p-3 border border-slate-200/80 shadow-sm flex flex-col relative overflow-hidden transition-all hover:shadow-md">' +
        '<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-sky-400 via-ocean-500 to-cyan-400"></div>' +

        '<!-- Card Header: Strict single line, uniform height -->' +
        '<div class="flex items-center justify-between gap-1 mb-2 pb-1.5 border-b border-slate-100 h-7">' +
          '<h2 class="text-base 2xl:text-[17px] font-bold font-display text-slate-900 whitespace-nowrap overflow-hidden text-ellipsis leading-none" title="' + loc.name + '">' +
            loc.name +
          '</h2>' +
          '<span class="text-[13px] font-mono text-slate-600 font-semibold bg-slate-100 px-2 py-0.5 rounded leading-none flex-shrink-0">' +
            localTime +
          '</span>' +
        '</div>' +

        '<!-- Current Weather Hero -->' +
        '<div class="flex items-center justify-between px-2.5 py-2 bg-gradient-to-r from-sky-50 to-blue-50/60 rounded-xl border border-sky-100 mb-2">' +
          '<div class="flex items-center gap-2">' +
            '<div class="p-1.5 rounded-xl bg-white shadow-xs flex-shrink-0">' +
              '<i data-lucide="' + condition.icon + '" class="w-6 h-6 2xl:w-7 2xl:h-7 ' + condition.color + '"></i>' +
            '</div>' +
            '<div class="leading-none">' +
              '<div class="text-2xl 2xl:text-3xl font-display font-extrabold text-slate-900 tracking-tight leading-none">' + curTemp + '°</div>' +
              '<div class="text-[14px] font-medium text-slate-700 truncate max-w-[95px] mt-1">' + condition.label + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="text-right text-[12.5px] text-slate-600 font-mono leading-tight">' +
            '<div><span class="text-slate-400">H:</span> <span class="font-bold text-slate-900 text-[13px]">' + todayHi + '°</span></div>' +
            '<div><span class="text-slate-400">L:</span> <span class="font-bold text-slate-700 text-[13px]">' + todayLo + '°</span></div>' +
            '<div class="text-[12px] text-slate-500 mt-0.5">' + feelsLike + '° feel</div>' +
          '</div>' +
        '</div>' +

        '<!-- 2x2 Metric Grid with Legible Fonts -->' +
        '<div class="grid grid-cols-2 gap-1.5 mb-2">' +
          '<div class="flex items-center gap-2 px-2 py-1.5 rounded-lg bg-slate-50 border border-slate-100">' +
            '<i data-lucide="wind" class="w-3.5 h-3.5 text-sky-500 flex-shrink-0"></i>' +
            '<div class="truncate leading-none">' +
              '<span class="text-slate-500 text-[11px] font-bold uppercase tracking-wider block mb-0.5">Wind</span>' +
              '<span class="font-bold text-slate-900 text-[13px]">' + curWind + ' mph ' + windDir + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="flex items-center gap-2 px-2 py-1.5 rounded-lg bg-slate-50 border border-slate-100">' +
            '<i data-lucide="droplets" class="w-3.5 h-3.5 text-blue-500 flex-shrink-0"></i>' +
            '<div class="truncate leading-none">' +
              '<span class="text-slate-500 text-[11px] font-bold uppercase tracking-wider block mb-0.5">Humidity</span>' +
              '<span class="font-bold text-slate-900 text-[13px]">' + curHumidity + '%</span>' +
            '</div>' +
          '</div>' +
          '<div class="flex items-center gap-2 px-2 py-1.5 rounded-lg bg-slate-50 border border-slate-100">' +
            '<i data-lucide="sun" class="w-3.5 h-3.5 text-amber-500 flex-shrink-0"></i>' +
            '<div class="truncate leading-none">' +
              '<span class="text-slate-500 text-[11px] font-bold uppercase tracking-wider block mb-0.5">UV Index</span>' +
              '<span class="font-bold text-slate-900 text-[13px]">' + todayUv + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="flex items-center gap-2 px-2 py-1.5 rounded-lg bg-blue-50/70 border border-blue-100">' +
            '<i data-lucide="cloud-rain" class="w-3.5 h-3.5 text-blue-500 flex-shrink-0"></i>' +
            '<div class="truncate leading-none">' +
              '<span class="text-blue-600 text-[11px] font-bold uppercase tracking-wider block mb-0.5">Precip</span>' +
              '<span class="font-bold text-blue-950 text-[13px]">' + todayPrecip + '%</span>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<!-- 7-Day Outlook (No large empty space) -->' +
        '<div class="pt-2 border-t border-slate-100 mb-2">' +
          '<div class="text-[11.5px] uppercase font-bold tracking-wider text-slate-500 mb-1 px-1">7-Day Outlook</div>' +
          '<div class="space-y-[1.5px]">' + dailyHtml + '</div>' +
        '</div>' +

        '<!-- 24-Hour Timeline Button -->' +
        '<div class="pt-1 border-t border-slate-100">' +
          '<button onclick="openHourlyModal(\'' + loc.id + '\')" class="w-full py-1.5 px-2 rounded-lg bg-white hover:bg-ocean-50 border border-slate-200 text-ocean-700 font-semibold text-[13px] flex items-center justify-center gap-1.5 transition active:scale-98 shadow-xs">' +
            '<i data-lucide="clock" class="w-3.5 h-3.5"></i>' +
            '<span>24-Hour Timeline</span>' +
          '</button>' +
        '</div>' +
      '</div>';
    }

    // Load and render all 5 locations
    async function loadAllLocations() {
      const container = document.getElementById('cardsGrid');
      
      // Render initial loading placeholders
      container.innerHTML = LOCATIONS.map(function(loc) {
        return '<div class="bg-white/70 rounded-2xl p-4 border border-slate-200 animate-pulse h-96 flex flex-col justify-between">' +
          '<div class="h-6 bg-slate-200 rounded w-1/2 mb-4"></div>' +
          '<div class="h-16 bg-slate-200 rounded mb-4"></div>' +
          '<div class="grid grid-cols-2 gap-2 mb-4"><div class="h-10 bg-slate-200 rounded"></div><div class="h-10 bg-slate-200 rounded"></div></div>' +
          '<div class="space-y-2"><div class="h-4 bg-slate-200 rounded"></div><div class="h-4 bg-slate-200 rounded"></div><div class="h-4 bg-slate-200 rounded"></div></div>' +
        '</div>';
      }).join('');

      // Fetch all weather in parallel
      const results = await Promise.all(
        LOCATIONS.map(function(loc) {
          return fetchLocationWeather(loc);
        })
      );

      // Save to store and build final HTML
      let fullHtml = '';
      results.forEach(function(data, idx) {
        const loc = LOCATIONS[idx];
        weatherDataStore[loc.id] = data;
        fullHtml += buildCardHtml(loc, data);
      });

      container.innerHTML = fullHtml;

      // Re-initialize Lucide SVG icons
      if (window.lucide) {
        lucide.createIcons();
      }
    }

    // Modal logic for 24-Hour Forecast
    function openHourlyModal(locId) {
      const loc = LOCATIONS.find(function(l) { return l.id === locId; });
      const data = weatherDataStore[locId];
      if (!loc || !data || !data.hourly) return;

      document.getElementById('modalTitle').textContent = loc.name + ' - Next 24 Hours';
      document.getElementById('modalSubtitle').textContent = 'Hourly condition, temperature, rain chance & wind speed';

      const hourlyList = document.getElementById('modalHourlyList');
      const hourly = data.hourly;
      let html = '';

      const maxHours = Math.min(24, hourly.time.length);
      for (let i = 0; i < maxHours; i++) {
        const timeStr = hourly.time[i];
        const dateObj = new Date(timeStr);
        const hourLabel = new Intl.DateTimeFormat('en-US', {
          timeZone: loc.timezone,
          hour: 'numeric',
          hour12: true
        }).format(dateObj);

        const temp = Math.round(hourly.temperature_2m[i]);
        const precip = Math.round(hourly.precipitation_probability[i] || 0);
        const wind = Math.round(hourly.wind_speed_10m[i] || 0);
        const condition = decodeWmo(hourly.weather_code[i]);

        html += '<div class="py-2.5 flex items-center justify-between text-sm hover:bg-slate-50 px-2 rounded-lg">' +
          '<div class="w-16 font-semibold text-slate-700">' + hourLabel + '</div>' +
          '<div class="flex items-center gap-2 w-32">' +
            '<i data-lucide="' + condition.icon + '" class="w-4 h-4 ' + condition.color + '"></i>' +
            '<span class="text-xs text-slate-600 truncate">' + condition.label + '</span>' +
          '</div>' +
          '<div class="w-20 text-center">' +
            (precip > 0 ? '<span class="text-xs font-bold text-blue-600">' + precip + '% rain</span>' : '<span class="text-xs text-slate-400">0%</span>') +
          '</div>' +
          '<div class="w-20 text-right text-xs text-slate-500 font-mono">' + wind + ' mph</div>' +
          '<div class="w-14 text-right font-bold text-slate-900 font-mono text-base">' + temp + '°</div>' +
        '</div>';
      }

      hourlyList.innerHTML = html;
      document.getElementById('hourlyModal').classList.remove('hidden');

      if (window.lucide) {
        lucide.createIcons();
      }
    }

    function closeHourlyModal() {
      document.getElementById('hourlyModal').classList.add('hidden');
    }

    function handleBackdropClick(e) {
      if (e.target.id === 'hourlyModal') {
        closeHourlyModal();
      }
    }

    // Keyboard support: Escape closes modal
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeHourlyModal();
    });

    // Auto-refresh every 10 minutes
    setInterval(loadAllLocations, 10 * 60 * 1000);

    // Initial load on ready
    window.addEventListener('DOMContentLoaded', loadAllLocations);
  </script>
</body>
</html>
